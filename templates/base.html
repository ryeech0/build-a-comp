<!DOCTYPE html>
<html lang="en" class="h-100">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>{% block title %}Build-a-Comp{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column h-100 overflow-hidden bg-dark text-white">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Build-a-Comp</a>
        </div>
    </nav>

    <main class="flex-grow-1 d-flex flex-column">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark text-center text-muted py-4">
        <small>Data scraped from vlr.gg &nbsp;|&nbsp; Build-a-Comp</small>
    </footer>
</body>
</html>
